apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-pypi
  namespace: project-alpha
spec:
  description: Lab 4 - workspaces in alpha may install packages from PyPI.
  endpointSelector:
    matchLabels:
      component: singleuser-server
  egress:
    - toFQDNs:
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
